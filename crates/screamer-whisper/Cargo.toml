[package]
name = "screamer-whisper"
version = "1.0.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "screamer_whisper"
path = "src/lib.rs"

[[bin]]
name = "bench-asr"
path = "src/bin/bench_asr.rs"

[[bin]]
name = "asr-try"
path = "src/bin/asr_try.rs"

[[bin]]
name = "asr-eval"
path = "src/bin/asr_eval.rs"

[dependencies]
libc = "0.2"
screamer-models = { path = "../screamer-models" }
whisper-rs = { version = "0.16", features = ["metal"] }
screamer-telemetry = { path = "../screamer-telemetry" }
hound = "3"
ureq = { version = "2", features = ["json", "tls"] }
serde_json = "1"

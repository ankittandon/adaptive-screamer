[project]
name = "screamer-evals"
version = "0.1.0"
description = "Eval Protocol suite for the Screamer styling layer."
requires-python = ">=3.10"
dependencies = [
    "eval-protocol>=0.3",
    "pytest>=8",
    # Pin to the mcp 1.x line. mcp 2.x (2.0.0+) is a real, breaking major of the
    # MCP SDK (it splits types into `mcp-types`, switches httpx -> `httpx2`, and
    # moves `streamablehttp_client` out of `mcp.client.streamable_http`). But
    # eval-protocol still imports the 1.x API and declares only `mcp>=1.9.2` with
    # no upper bound, so a fresh resolve grabs 2.x and fails at import. <2 keeps
    # us compatible until eval-protocol supports mcp 2.x; drop it then.
    "mcp>=1.9.2,<2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["adapter"]
packages = ["scorers"]
